<!DOCTYPE html>

<style>
  body { background:#f5f5f5; padding:40px; margin:0; font-family:'Inter',system-ui,sans-serif; color:#666; font-size:13px; }

<body>

<h2>Test 06 — IDP Integration · Gateway · Primary Broker · Internal Network (VDI pools + Backup)</h2>

<div class="frame">

    </marker>
  </defs>

  <!-- ================= LAYER 1: ZONES ================= -->
  <!-- IDP Integration -->
  <rect x="40" y="70" width="200" height="460" rx="10" fill="none" stroke="#BDBDBD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <image href="icons/id.svg" x="58" y="85" width="22" height="22"/>
  <text x="87" y="101" font-size="13" font-weight="500" fill="#373737">IDP Integration</text>

  <!-- Cloud or DMZ -->
  <rect x="486" y="252" width="200" height="111" rx="10" fill="none" stroke="#BDBDBD" stroke-width="1.5" stroke-dasharray="6 4"/>

  <path d="M443 321.5 H502" fill="none" stroke="#0AA9FF" stroke-width="2" marker-end="url(#tip)"/>

  <path d="M932 321.5 H893" fill="none" stroke="#0AA9FF" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M729 321.5 H670" fill="none" stroke="#0AA9FF" stroke-width="2" marker-end="url(#tip)"/>

  <path d="M1155 141.5 H1115" fill="none" stroke="#0AA9FF" stroke-width="2"/>

  <path d="M1115 321.5 H1096" fill="none" stroke="#0AA9FF" stroke-width="2" marker-end="url(#tip)"/>

  <path d="M1538 141.5 V501.5" fill="none" stroke="#0AA9FF" stroke-width="2"/>
  <path d="M1538 321.5 H1557" fill="none" stroke="#0AA9FF" stroke-width="2" marker-end="url(#tip)"/>

    <text x="39" y="27" font-size="12" fill="#373737">TLS 1.3 Traffic</text>
  </g>

    <rect width="160" height="43" rx="7" fill="#fff" stroke="#0A74D6" stroke-width="1.5"/>

    <text x="39" y="35" font-size="12" fill="#0A74D6">Gateway</text>

    <rect width="160" height="43" rx="7" fill="#fff" stroke="#BDBDBD" stroke-width="1.5"/>
    <image href="icons/vpn-tunnels.svg" x="10" y="10" width="23" height="23"/>

  </g>
  <g transform="translate(1358,480)">
    <rect width="160" height="43" rx="7" fill="#fff" stroke="#0A74D6" stroke-width="1.5"/>

  <!-- Backup -->
  <g transform="translate(1561,300)">
    <rect width="160" height="43" rx="7" fill="#fff" stroke="#BDBDBD" stroke-width="1.5"/>
    <image href="icons/database.svg" x="10" y="10" width="23" height="23"/>
    <text x="39" y="27" font-size="12" fill="#373737">Backup</text>
